name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: setapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/setapi_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t setapi:ci .
      - name: Validate Compose
        run: |
          python3 scripts/init_env.py
          docker compose config --quiet
      - name: Test the built image against PostgreSQL and Redis
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e REDIS_URL \
            -v "$PWD/tests:/tests:ro" \
            setapi:ci sh -c 'pip install --target /tmp/testdeps pytest==9.1.1 && PYTHONPATH=/tmp/testdeps:/srv/setapi python -m pytest -q /tests -p no:cacheprovider'
      - name: Audit locked dependencies and high-severity code findings
        run: |
          python3 -m venv /tmp/security-tools
          /tmp/security-tools/bin/pip install pip-audit==2.10.1 bandit==1.9.4
          /tmp/security-tools/bin/pip-audit -r requirements.lock --no-deps --disable-pip
          /tmp/security-tools/bin/bandit -r app -lll -q
      - name: Install the three-service stack
        run: bash install.sh
      - name: Verify API, login, worker and container names
        run: |
          docker exec setapi_app python -m app.healthcheck
          python3 scripts/smoke_install.py
          test "$(docker compose ps --services --status running | sort | tr '\n' ' ')" = "setapi_app setapi_db setapi_redis "
      - name: Stop test stack
        if: always()
        run: docker compose down
